<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .logo-stroke { stroke: #1b3b22; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .leaf-fill { fill: #4a6c47; }
      .node-fill { fill: #1b3b22; }
      .logo-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 42px; font-weight: 500; fill: #1b3b22; letter-spacing: 0.03em; }
      .ai-text { font-weight: 400; letter-spacing: 0.06em; }
    </style>
  </defs>

  <!-- Circular frame with open circuit break -->
  <!-- Main circle arc from bottom ground up through left to top right -->
  <path class="logo-stroke" d="M 220 236 A 88 88 0 1 1 268 126" />

  <!-- Circuit traces on the right -->
  <!-- Top trace node -->
  <circle cx="288" cy="116" r="6" class="logo-stroke" />
  <circle cx="288" cy="116" r="2.5" class="node-fill" />
  
  <!-- Middle trace line and node -->
  <path class="logo-stroke" d="M 276 156 L 292 142 L 304 142" />
  <circle cx="308" cy="142" r="6" class="logo-stroke" />
  <circle cx="308" cy="142" r="2.5" class="node-fill" />

  <!-- Bottom trace line and node -->
  <path class="logo-stroke" d="M 264 198 C 274 190 286 182 292 170" />
  <circle cx="294" cy="166" r="6" class="logo-stroke" />
  <circle cx="294" cy="166" r="2.5" class="node-fill" />

  <!-- Ground contours / mounds at base -->
  <!-- Left earth furrow -->
  <path class="logo-stroke" d="M 130 205 C 160 204 195 218 226 242" />
  <!-- Right earth furrow -->
  <path class="logo-stroke" d="M 206 226 C 228 214 248 210 266 224" />

  <!-- Sprout Stem -->
  <path class="logo-stroke" d="M 194 212 L 194 176" stroke-width="4" />

  <!-- Left Leaf -->
  <path class="leaf-fill" d="M 193 182 C 185 170 148 150 142 120 C 168 124 188 146 195 178 Z" />

  <!-- Right Leaf -->
  <path class="leaf-fill" d="M 195 180 C 205 162 230 134 254 112 C 258 138 244 172 198 184 Z" />

  <!-- Brand Typography -->
  <text x="200" y="324" text-anchor="middle" class="logo-text">
    CropSense <tspan class="ai-text">AI</tspan>
  </text>
</svg>
